<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .scanner-page {
            width: 100%;
            max-width: 1100px;
            min-height: 100vh;
            background: #fff;
            padding: 20px 16px 24px;
        }

        #reader-wrap {
            width: 100%;
            max-width: 700px;
            margin: 20px auto 0;
            background: #fff;
            position: relative;
        }

        .overlay-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
        }

        #cancelBtn {
            background: rgba(108,117,125,0.92);
            color: #fff;
            border: none;
            padding: 14px 24px;
            font-size: 20px;
            border-radius: 12px;
            cursor: pointer;
        }

        #cancelBtn {
            width: 100%;
            background: #6c757d;
            color: #fff;
            border: none;
            padding: 18px 20px;
            font-size: 22px;
            border-radius: 12px;
            cursor: pointer;
        }

        #reader {
            width: 100%;
        }

        #status {
            text-align: center;
            padding: 14px 20px 24px;
            color: #666;
            font-size: 16px;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>
<body>
    <div class="scanner-page">
        <div id="reader-wrap">
            <div class="overlay-actions">
                <button id="cancelBtn" type="button">Cancel</button>
            </div>

            <div id="reader"></div>
        </div>

        <p id="status">Point your camera at a QR code</p>
    </div>

    <script>
        const cancelBtn = document.getElementById('cancelBtn');
        const statusEl = document.getElementById('status');

        let hasScanned = false;
        let html5QrCode = null;

        cancelBtn.addEventListener('click', () => {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '/';
            }
        });

        const _xd = (b, k) => b.map((v, i) => String.fromCharCode(v ^ k.charCodeAt(i % k.length))).join('');
        const _k = [113, 122, 57].map(c => String.fromCharCode(c)).join('');
        const _fc = [23, 19, 85, 20, 71];
        const _bu = atob('aHR0cDovL2xvY2FsaG9zdC9SZXNwb25zZUZvcm0vcGFnZXMvZmlsdGVycy9kb2N1bWVudHMvdmlldy1kb2N1bWVudC92aWV3LWRvY3VtZW50Lmh0bWw/');

        function goToScannedValue(value) {
            const scanned = (value || '').trim();
            if (!scanned) return;

                if (scanned.startsWith(_xd(_fc, _k))) {
                window.location.href = _bu + scanned;
                return;
            }

            // No file= found — go back to previous page
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '/';
            }
        }

        async function onScanSuccess(decodedText) {
            if (hasScanned) return;
            hasScanned = true;

            statusEl.textContent = 'QR code detected. Opening...';

            try {
                if (html5QrCode) {
                    await html5QrCode.stop();
                    await html5QrCode.clear();
                }
            } catch (e) {
                // ignore stop errors
            }

            goToScannedValue(decodedText);
        }

        function onScanFailure(error) {
            // keep silent during normal scanning
        }

        async function startScanner() {
            if (!window.Html5Qrcode) {
                statusEl.textContent = 'Scanner library failed to load.';
                statusEl.classList.add('error');
                return;
            }

            html5QrCode = new Html5Qrcode("reader");

            try {
                const cameras = await Html5Qrcode.getCameras();

                if (!cameras || !cameras.length) {
                    statusEl.textContent = 'No camera found on this device.';
                    statusEl.classList.add('error');
                    return;
                }

                const backCamera = cameras.find(cam =>
                    /back|rear|environment/i.test(cam.label)
                );

                const cameraId = backCamera ? backCamera.id : cameras[0].id;

                await html5QrCode.start(
                    cameraId,
                    {
                        fps: 10,
                        qrbox: function(viewfinderWidth, viewfinderHeight) {
                            const size = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.7);
                            return { width: size, height: size };
                        }
                    },
                    onScanSuccess,
                    onScanFailure
                );

                statusEl.textContent = 'Point your camera at a QR code';
            } catch (err) {
                statusEl.textContent = 'Camera blocked or unavailable. Enable camera permission and reload.';
                statusEl.classList.add('error');
            }
        }

        startScanner();
    </script>
</body>
</html>
